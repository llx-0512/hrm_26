spring:
  datasource:
    master:
      jdbc-url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/hrm_test?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2b8
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:llx123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
    activiti:
      jdbc-url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/hrm_activiti_test?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2b8
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:llx123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource

  activiti:
    database-schema-update: true
    history-level: full
    db-history-used: true

  redis:
    enabled: false  # CI 环境禁用 Redis

  sql:
    init:
      mode: always
      schema-locations: classpath:init-test-db.sql
      continue-on-error: true

  main:
    allow-bean-definition-overriding: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-enums-package: com.qiujie.enums

