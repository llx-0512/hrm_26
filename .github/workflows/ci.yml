name: HRM CI - 集成测试

# ============================================================
# GitHub Actions CI 工作流
# 触发条件：推送到 master/develop 分支 或 Pull Request
# 环境要求：Java 17 + Maven + MySQL 8.0（apt-get 安装，无需 Docker Hub）
# ============================================================

on:
  push:
    branches: [master, develop, main, UT]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      test-type:
        description: '测试类型 (all / integration-only / unit-only)'
        required: false
        default: 'all'

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PASSWORD: test123
  MAVEN_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=256m"

jobs:
  # ============================================================
  # Job 1: 集成测试（使用 apt-get 安装 MySQL，无需 Docker）
  # ============================================================
  integration-test:
    name: "集成测试 (Java 17 + MySQL 8.0)"
    runs-on: ubuntu-latest

    steps:
      # Step 1: 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # Step 2: 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: 安装并启动 MySQL 8.0（apt-get 方式，不依赖 Docker Hub）
      - name: 安装并启动 MySQL 8.0
        run: |
          echo "=== 安装 MySQL 8.0 ==="
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mysql-server mysql-client

          echo "=== 配置 MySQL ==="
          sudo systemctl start mysql
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'test123';"
          sudo mysql -u root -ptest123 -e "FLUSH PRIVILEGES;"

          echo "=== 创建测试数据库 ==="
          sudo mysql -u root -ptest123 -e "CREATE DATABASE IF NOT EXISTS hrm_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sudo mysql -u root -ptest123 -e "CREATE DATABASE IF NOT EXISTS hrm_activiti_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

          echo "=== MySQL 状态检查 ==="
          sudo systemctl status mysql --no-pager || true
          sudo mysql -u root -ptest123 -e "SELECT VERSION();"

      # Step 4: 初始化测试数据库表结构
      - name: 初始化测试数据库表结构和数据
        run: |
          sudo mysql -u root -ptest123 hrm_test < hrm/src/test/resources/init-test-db.sql
          echo "测试数据库初始化完成"

      # Step 5: 缓存 Maven 依赖
      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 6: 运行集成测试
      - name: 运行集成测试
        run: |
          cd hrm
          mvn test \
            -Dtest="com.qiujie.integration.*Test" \
            -Dspring.profiles.active=test \
            -DfailIfNoTests=false \
            --batch-mode
        timeout-minutes: 20

      # Step 7: 生成覆盖率报告
      - name: 生成 JaCoCo 覆盖率报告
        if: always()
        run: |
          cd hrm
          mvn jacoco:report --batch-mode

      # Step 8: 上传测试报告
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            hrm/target/surefire-reports/
            hrm/target/site/jacoco/
          retention-days: 30

  # ============================================================
  # Job 2: 全量测试（含覆盖率）
  # ============================================================
  full-test:
    name: "全量测试 + 覆盖率 (Java 17 + MySQL 8.0)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 安装并启动 MySQL 8.0
        run: |
          echo "=== 安装 MySQL 8.0 ==="
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mysql-server mysql-client

          echo "=== 配置 MySQL ==="
          sudo systemctl start mysql
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'test123';"
          sudo mysql -u root -ptest123 -e "FLUSH PRIVILEGES;"

          echo "=== 创建数据库 ==="
          sudo mysql -u root -ptest123 -e "CREATE DATABASE IF NOT EXISTS hrm_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sudo mysql -u root -ptest123 -e "CREATE DATABASE IF NOT EXISTS hrm_activiti_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

          echo "=== 状态检查 ==="
          sudo mysql -u root -ptest123 -e "SELECT VERSION();"

      - name: 初始化测试数据
        run: |
          sudo mysql -u root -ptest123 hrm_test < hrm/src/test/resources/init-test-db.sql

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-full-${{ hashFiles('**/pom.xml') }}

      - name: 运行全量测试
        run: |
          cd hrm
          mvn test \
            -Dspring.profiles.active=test \
            -DfailIfNoTests=false \
            --batch-mode
        timeout-minutes: 25

      - name: 生成 JaCoCo 覆盖率报告
        if: always()
        run: cd hrm && mvn jacoco:report --batch-mode

      - name: 上传全量测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: |
            hrm/target/surefire-reports/
            hrm/target/site/jacoco/
          retention-days: 30
